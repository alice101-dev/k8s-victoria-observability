apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: addons
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - clusters:
              selector:
                matchExpressions:
                  - key: env
                    operator: Exists
          - git:
              repoURL: https://github.com/alice101-dev/k8s-victoria-observability.git
              revision: main
              files:
                - path: addons/*/config.yaml
  template:
    metadata:
      name: "{{ .path.basename }}"
      labels:
        layer: addons
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform
      sources:
        - repoURL: "{{ .repoURL }}"
          chart: "{{ .chart }}"
          targetRevision: "{{ .version }}"
          helm:
            releaseName: "{{ .path.basename }}"
            ignoreMissingValueFiles: true
            valueFiles:
              - $values/{{ .path.path }}/values.yaml
              - $values/{{ .path.path }}/values-{{ .metadata.labels.env }}.yaml
        - repoURL: https://github.com/alice101-dev/k8s-victoria-observability.git
          targetRevision: main
          ref: values
      destination:
        name: "{{ .name }}"
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
          - SkipDryRunOnMissingResource=true
        retry:
          limit: 20
          backoff:
            duration: 30s
            factor: 2
            maxDuration: 5m
  templatePatch: |
    {{- if hasKey . "ignoreDifferences" }}
    spec:
      ignoreDifferences: {{ toJson .ignoreDifferences }}
    {{- end }}
