apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - credentials.yaml
  - token-issuer.yaml
  - mcp-argocd.yaml
configMapGenerator:
  - name: mcp-argocd-token-issuer
    namespace: monitoring
    files:
      - issue-token.js
    options:
      disableNameSuffixHash: true
      annotations:
        argocd.argoproj.io/sync-wave: "-2"
