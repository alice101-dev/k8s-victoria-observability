apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: grafana-mcp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/component: mcp-server
  podMetricsEndpoints:
    - port: mcp-http
      path: /metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: "${1}:9090"
