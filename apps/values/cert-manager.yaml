# =============================================================================
# cert-manager — chart jetstack/cert-manager v1.21.2
# Issues the TLS certificates of the CloudNativePG Barman Cloud plugin (operator ↔ plugin mTLS).
# Metrics (port 9402, on by default) are scraped by observability/platform: certificate expiry and readiness.
# =============================================================================
crds:
  enabled: true

global:
  # Leader election in the release namespace (the default, kube-system, is outside this AppProject).
  leaderElection:
    namespace: cert-manager

resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 128Mi }

webhook:
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

cainjector:
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 256Mi }

# Post-install API check Job (Helm hook): Argo CD already waits for the Deployments to be healthy.
startupapicheck:
  enabled: false
