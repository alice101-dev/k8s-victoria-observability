# =============================================================================
# cloudnative-pg — chart cnpg/cloudnative-pg 0.29.1 (operator 1.30.1)
# Production-standard PostgreSQL operator for Kubernetes (failover, rolling minor updates,
# object storage backups, built-in metrics exporter on port 9187).
# =============================================================================
replicaCount: 1

crds:
  create: true

resources:
  requests: { cpu: 25m, memory: 64Mi }
  limits: { memory: 256Mi }

# PodMonitor is a prometheus-operator CRD (not used here). PostgreSQL instances and this operator are
# scraped via VMPodScrape in apps/k8s/data/monitoring.yaml; the dashboard comes from the k8s-stack sync job.
monitoring:
  podMonitorEnabled: false
  grafanaDashboard:
    create: false
