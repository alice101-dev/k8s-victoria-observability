# Wave -1: data tier — PostgreSQL 18 (CloudNativePG Cluster), Redis, secret, NetworkPolicy, scrape config.
# Needs CRDs from: cloudnative-pg (wave -2), external-secrets & vm-operator (observability root).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-data
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ include "app.repoURL" . }}
    targetRevision: {{ .Values.targetRevision }}
    path: apps/k8s/data
    # The backup bucket name contains the project ID → from Terraform (root app), not in Git.
    kustomize:
      patches:
        - target:
            group: barmancloud.cnpg.io
            kind: ObjectStore
            name: shop-backup
          patch: |-
            - op: replace
              path: /spec/configuration/destinationPath
              value: gs://{{ required "backupBucket is required (injected by the root Application from Terraform)" .Values.backupBucket }}
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  {{- include "app.syncPolicy" . | nindent 2 }}
