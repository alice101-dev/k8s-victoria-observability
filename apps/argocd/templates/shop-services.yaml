# Wave 0: 6 Go microservices + traffic generator + VMServiceScrape + VMRule + Grafana dashboard.
# Image tag lives in apps/k8s/services/values.yaml (bumped by `make release TAG=...` → commit → Argo CD sync).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shop-services
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  source:
    repoURL: {{ include "app.repoURL" . }}
    targetRevision: {{ .Values.targetRevision }}
    path: apps/k8s/services
    helm:
      releaseName: shop
      # The registry contains the project ID → from Terraform (root app); the image tag stays in Git (values.yaml).
      valuesObject:
        image:
          registry: {{ required "imageRegistry is required (injected by the root Application from Terraform)" .Values.imageRegistry | quote }}
  destination:
    server: https://kubernetes.default.svc
    namespace: shop
  {{- include "app.syncPolicy" . | nindent 2 }}
