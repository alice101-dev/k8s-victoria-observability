# PostgreSQL 18 managed by CloudNativePG.
# - Secret "shop-db-app" (username/password/uri) is created AUTOMATICALLY by the operator → used via DATABASE_URL.
# - Services: shop-db-rw (primary, read-write), shop-db-ro (replicas), shop-db-r (all instances).
# - Built-in metrics exporter on port 9187 (scraped by VMPodScrape, monitoring.yaml).
# - PostgreSQL logs are JSON on stdout → shipped to VictoriaLogs by vlagent.
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: shop-db
  labels:
    app.kubernetes.io/name: shop-db
    app.kubernetes.io/part-of: shop
spec:
  # 1 primary + 1 standby with automatic failover; the application keeps using shop-db-rw.
  # With 3+ zones or nodes, 3 instances also survive a second failure.
  instances: 2
  imageName: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie
  primaryUpdateStrategy: unsupervised
  # Updates promote the standby first (seconds of write downtime) instead of restarting the primary
  # in place, which waits for the smart shutdown and then a failover (~3 minutes).
  primaryUpdateMethod: switchover
  # Pooled application connections never close by themselves, so a smart shutdown always waits the
  # full timeout (default 180s) before a fast shutdown. 15s bounds in-place primary restarts.
  smartShutdownTimeout: 15

  bootstrap:
    initdb:
      database: app
      owner: app

  # Instances on different nodes: one Spot preemption never takes both.
  affinity:
    enablePodAntiAffinity: true
    podAntiAffinityType: required
    topologyKey: kubernetes.io/hostname

  postgresql:
    # Quorum synchronous replication: a commit waits for the standby, so failover loses no data.
    # "preferred" keeps accepting writes (asynchronously) while the standby is down.
    synchronous:
      method: any
      number: 1
      dataDurability: preferred
    parameters:
      max_connections: "100"
      shared_buffers: 64MB
      # Planner hints sized to this pod (512Mi limit) and SSD storage (pd-balanced); reload only.
      effective_cache_size: 384MB
      random_page_cost: "1.1"
      # Slow queries (>250ms) are logged → searchable in VictoriaLogs.
      log_min_duration_statement: 250ms
      log_lock_waits: "on"
      log_checkpoints: "on"
      # The operator adds shared_preload_libraries & CREATE EXTENSION pg_stat_statements automatically.
      pg_stat_statements.max: "1000"
      pg_stat_statements.track: all

  storage:
    storageClass: standard-rwo
    size: 10Gi

  # WAL archiving and base backups through the Barman Cloud plugin (ObjectStore in backup.yaml).
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      # Explicit: the operator webhook defaults it, and a missing list field shows as drift in Argo CD.
      enabled: true
      isWALArchiver: true
      parameters:
        barmanObjectName: shop-backup

  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { memory: 512Mi }

  # PDBs for the primary and the standby; on a node drain the operator switches over first.
  enablePDB: true

  # Extra exporter metrics: top statements (pg_stat_statements) and table health (postgres-monitoring.yaml).
  # The operator always puts its default queries first; listing them keeps Argo CD free of drift.
  monitoring:
    customQueriesConfigMap:
      - name: cnpg-default-monitoring
        key: queries
      - name: shop-db-monitoring
        key: queries.yaml
