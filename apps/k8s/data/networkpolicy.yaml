# The data tier is reachable only from shop app pods (+ operator, metrics scraper and the read-only
# Postgres MCP server).
# Enforced by GKE Dataplane V2 (ADVANCED_DATAPATH).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redis
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: redis
  policyTypes: [Ingress]
  ingress:
    # Shop app → Redis and Sentinel; also replication and Sentinel gossip between the Redis pods.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: shop
      ports:
        - { protocol: TCP, port: 6379 }
        - { protocol: TCP, port: 26379 }
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9121 }
        - { protocol: TCP, port: 9355 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: shop-db
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: shop-db
  policyTypes: [Ingress]
  ingress:
    # Shop app → PostgreSQL.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/part-of: shop
      ports:
        - { protocol: TCP, port: 5432 }
    # Read-only Postgres MCP server (postgres-mcp.yaml), role mcp_readonly.
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgres-mcp
      ports:
        - { protocol: TCP, port: 5432 }
    # Between instances (streaming replication & status) when instances > 1.
    - from:
        - podSelector:
            matchLabels:
              cnpg.io/cluster: shop-db
      ports:
        - { protocol: TCP, port: 5432 }
        - { protocol: TCP, port: 8000 }
    # CloudNativePG operator → instance manager (status API) & PostgreSQL.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: cnpg-system
      ports:
        - { protocol: TCP, port: 8000 }
        - { protocol: TCP, port: 5432 }
    # vmagent → CNPG built-in metrics exporter.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - { protocol: TCP, port: 9187 }
