# Custom metrics for the CloudNativePG exporter (spec.monitoring.customQueriesConfigMap in postgres.yaml),
# on top of the operator's default queries. Metric names: cnpg_<query>_<column>.
# The label cnpg.io/reload makes the instances reload the queries when this ConfigMap changes.
# Cardinality is bounded: top 10 statements, at most 50 tables, at most 5 blocking sessions.
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-db-monitoring
  labels:
    cnpg.io/reload: ""
data:
  queries.yaml: |
    # Most expensive statements by total execution time (cluster-wide view, application roles only:
    # superusers and the operator's own roles, e.g. cnpg_metrics_exporter, are left out).
    pg_stat_statements_top:
      primary: true
      query: |
        SELECT d.datname,
               s.queryid::text AS queryid,
               left(regexp_replace(s.query, '\s+', ' ', 'g'), 120) AS query,
               s.calls,
               s.total_exec_time / 1000 AS total_exec_seconds,
               s.mean_exec_time / 1000 AS mean_exec_seconds,
               s.rows,
               s.shared_blks_hit,
               s.shared_blks_read,
               s.temp_blks_written
        FROM pg_stat_statements s
        JOIN pg_database d ON d.oid = s.dbid
        JOIN pg_roles r ON r.oid = s.userid
        WHERE s.toplevel AND NOT r.rolsuper AND r.rolname NOT LIKE 'cnpg\_%'
        ORDER BY s.total_exec_time DESC
        LIMIT 10
      metrics:
        - datname:
            usage: LABEL
            description: Database
        - queryid:
            usage: LABEL
            description: Statement ID (pg_stat_statements.queryid)
        - query:
            usage: LABEL
            description: Normalized statement text, truncated to 120 characters
        - calls:
            usage: COUNTER
            description: Number of executions
        - total_exec_seconds:
            usage: COUNTER
            description: Total execution time
        - mean_exec_seconds:
            usage: GAUGE
            description: Mean execution time
        - rows:
            usage: COUNTER
            description: Rows returned or affected
        - shared_blks_hit:
            usage: COUNTER
            description: Blocks served from shared_buffers
        - shared_blks_read:
            usage: COUNTER
            description: Blocks read from disk or the OS cache
        - temp_blks_written:
            usage: COUNTER
            description: Temporary blocks written (sorts and hashes that did not fit in work_mem)

    # Table health: dead tuples (bloat, autovacuum lag) and sequential vs index scans.
    pg_stat_user_tables:
      primary: true
      target_databases: ["*"]
      query: |
        SELECT current_database() AS datname,
               schemaname,
               relname,
               n_live_tup,
               n_dead_tup,
               seq_scan,
               coalesce(idx_scan, 0) AS idx_scan,
               n_mod_since_analyze,
               coalesce(extract(epoch FROM greatest(last_vacuum, last_autovacuum)), 0) AS last_vacuum_time,
               coalesce(extract(epoch FROM greatest(last_analyze, last_autoanalyze)), 0) AS last_analyze_time,
               vacuum_count + autovacuum_count AS vacuums,
               pg_total_relation_size(relid) AS total_bytes
        FROM pg_stat_user_tables
        ORDER BY pg_total_relation_size(relid) DESC
        LIMIT 50
      metrics:
        - datname:
            usage: LABEL
            description: Database
        - schemaname:
            usage: LABEL
            description: Schema
        - relname:
            usage: LABEL
            description: Table
        - n_live_tup:
            usage: GAUGE
            description: Estimated live rows
        - n_dead_tup:
            usage: GAUGE
            description: Estimated dead rows waiting for vacuum
        - seq_scan:
            usage: COUNTER
            description: Sequential scans
        - idx_scan:
            usage: COUNTER
            description: Index scans
        - n_mod_since_analyze:
            usage: GAUGE
            description: Rows modified since the last analyze
        - last_vacuum_time:
            usage: GAUGE
            description: Last manual or auto vacuum (epoch seconds, 0 = never)
        - last_analyze_time:
            usage: GAUGE
            description: Last manual or auto analyze (epoch seconds, 0 = never)
        - vacuums:
            usage: COUNTER
            description: Manual plus auto vacuums
        - total_bytes:
            usage: GAUGE
            description: Table size including indexes and TOAST

    # Sessions that hold a lock others wait for: who (pid, user, application), in which state (an "idle in
    # transaction" blocker is a client that stopped talking) and for how long. No rows while nothing waits.
    # pg_blocking_pids() briefly locks the lock manager, so it only runs for sessions waiting on a lock.
    # query_id joins with pg_stat_statements_top; raw query text is left out (it may contain literals).
    pg_blocking:
      primary: true
      query: |
        WITH waiting AS MATERIALIZED (
          SELECT pid, query_start FROM pg_stat_activity WHERE wait_event_type = 'Lock'
        )
        SELECT coalesce(b.datname, '') AS datname,
               b.pid::text AS pid,
               coalesce(b.usename, '') AS usename,
               coalesce(nullif(b.application_name, ''), 'unknown') AS application_name,
               coalesce(b.state, '') AS state,
               coalesce(b.query_id::text, '') AS query_id,
               count(*) AS blocked_sessions,
               max(extract(epoch FROM now() - w.query_start)) AS max_wait_seconds,
               coalesce(extract(epoch FROM now() - b.xact_start), 0) AS xact_age_seconds
        FROM waiting w
        CROSS JOIN LATERAL unnest(pg_blocking_pids(w.pid)) AS bp(pid)
        JOIN pg_stat_activity b ON b.pid = bp.pid
        GROUP BY b.datname, b.pid, b.usename, b.application_name, b.state, b.query_id, b.xact_start
        ORDER BY count(*) DESC
        LIMIT 5
      metrics:
        - datname:
            usage: LABEL
            description: Database of the blocking session
        - pid:
            usage: LABEL
            description: Process ID of the blocking session (record.process_id in the PostgreSQL logs)
        - usename:
            usage: LABEL
            description: Role of the blocking session
        - application_name:
            usage: LABEL
            description: application_name of the blocking session (the service name for the shop services)
        - state:
            usage: LABEL
            description: State of the blocking session (active, idle in transaction, ...)
        - query_id:
            usage: LABEL
            description: Identifier of the blocking session's latest statement (pg_stat_statements queryid)
        - blocked_sessions:
            usage: GAUGE
            description: Sessions waiting for a lock this session holds
        - max_wait_seconds:
            usage: GAUGE
            description: Longest-running statement among the waiting sessions
        - xact_age_seconds:
            usage: GAUGE
            description: Age of the blocking session's transaction
