apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - postgres.yaml
  - postgres-monitoring.yaml
  - redis.yaml
  - backup.yaml
  - networkpolicy.yaml
  - monitoring.yaml

# CloudNativePG dashboard (vendored with fixes, see dashboards/vendor-cloudnative-pg.py),
# loaded by the Grafana sidecar into the "Shop" folder.
configMapGenerator:
  - name: shop-db-dashboard
    files:
      - dashboards/cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Shop
