apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: shop
resources:
  - postgres.yaml
  - postgres-monitoring.yaml
  - postgres-mcp.yaml
  - redis.yaml
  - redis-monitoring.yaml
  - backup.yaml
  - networkpolicy.yaml
  - monitoring.yaml

# CloudNativePG dashboard (vendored with fixes, see dashboards/vendor-cloudnative-pg.py) and the Redis dashboard
# (generated by apps/k8s/services/dashboards/generator/redis.py), loaded by the Grafana sidecar into "Shop".
configMapGenerator:
  - name: shop-redis-dashboard
    files:
      - dashboards/shop-redis.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Shop
  - name: shop-db-dashboard
    files:
      - dashboards/cloudnative-pg.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Shop
