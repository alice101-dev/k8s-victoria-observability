# One VMServiceScrape for all app services: job label = service name
# (jobLabel), same as service.name in traces → Trace → Metrics correlation in Grafana.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: shop-services
spec:
  jobLabel: app.kubernetes.io/name
  selector:
    matchLabels:
      app.kubernetes.io/part-of: shop
      app.kubernetes.io/component: backend
  endpoints:
    - port: http
      path: /metrics
{{- if .Values.alerts.enabled }}
---
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: shop-services
spec:
  groups:
    # METRICS-based alerts — evaluated by vmalert against VictoriaMetrics.
    # Error rate and latency are covered by the SLO burn-rate alerts (VMRule shop-slo).
    - name: shop-red
      rules:
        - record: job:http_server_requests:rate5m
          expr: sum by (job, code) (rate(http_server_requests_total{namespace="shop"}[5m]))
        # A service with no ready pod serves no requests, so its own SLI disappears instead of
        # burning; only its callers would alert. This names the service that is down.
        - alert: ShopServiceDown
          expr: kube_deployment_status_replicas_available{namespace="shop", deployment=~"{{ keys .Values.services | sortAlpha | join "|" }}"} == 0
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: {{`"{{ $labels.deployment }} has no available replicas"`}}
            description: {{`"Every request to {{ $labels.deployment }} fails. Check its pods' startup logs (waiting for dependency) and recent changes."`}}
        - alert: ShopPaymentDeclineRateHigh
          expr: |
            sum(rate(payments_total{namespace="shop", status="declined"}[10m]))
              / sum(rate(payments_total{namespace="shop", status=~"approved|declined"}[10m]))
              > 0.3
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Payments declined > 30% over 10 minutes
            description: Likely a payment provider issue — check payment-provider.authorize spans.
    # LOGS-based alerts — LogsQL evaluated by vmalert against VictoriaLogs
    # (the k8s-stack internal vmauth routes /select/logsql to vlselect).
    - name: shop-logs
      type: vlogs
      interval: 5m
      rules:
        - alert: ShopErrorLogsSpike
          expr: '{kubernetes.pod_namespace="shop"} level:=ERROR | stats by (service) count() as error_logs | filter error_logs:>20'
          labels:
            severity: warning
          annotations:
            summary: {{`"{{ $labels.service }}: {{ $value }} ERROR logs in 5 minutes"`}}
            description: 'Query in Grafana Explore (VictoriaLogs): {kubernetes.pod_namespace="shop"} level:=ERROR'
{{- end }}
{{- if .Values.slo.enabled }}
{{- $slo := .Values.slo }}
{{- /* SLI targets: every service (all of its requests) and every user journey (api-gateway routes). */}}
{{- $targets := list }}
{{- range $svc := keys .Values.services | sortAlpha }}
{{- $targets = append $targets (dict "name" $svc "kind" "service" "sel" (printf "namespace=\"shop\", job=\"%s\"" $svc) "o" (get $slo.overrides $svc | default dict)) }}
{{- end }}
{{- range $name := keys $slo.journeys | sortAlpha }}
{{- $j := get $slo.journeys $name }}
{{- $targets = append $targets (dict "name" $name "kind" "journey" "sel" (printf "namespace=\"shop\", job=\"api-gateway\", method=\"%s\", route=~\"%s\"" $j.method $j.route) "o" $j) }}
{{- end }}
---
# SLIs per target (labels: job = service or journey name, slo = availability|latency, kind = service|journey):
# error ratios per window for burn rates, 5m request/error rates for the traffic-weighted 30d SLI,
# objectives as series. Burn rate = error ratio / (1 - objective); 1 spends the budget in exactly 30d.
# Binary operators match on (job, slo, kind): with "on", only those labels are kept in the result.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: shop-slo
spec:
  groups:
    - name: shop-slo-sli
      # slo:sli_window:seconds below assumes this 30s interval.
      interval: 30s
      rules:
        - record: slo:objective:ratio
          expr: |
            {{- range $i, $t := $targets }}
            {{ if $i }}or {{ end }}label_set(vector({{ $t.o.availability | default $slo.availability }}), "job", "{{ $t.name }}", "slo", "availability", "kind", "{{ $t.kind }}")
            or label_set(vector({{ $t.o.latency | default $slo.latency }}), "job", "{{ $t.name }}", "slo", "latency", "kind", "{{ $t.kind }}")
            {{- end }}
        {{- range $w := list "5m" "30m" "1h" "2h" "6h" "1d" "3d" }}
        - record: slo:sli_error:ratio_rate{{ $w }}
          expr: |
            {{- range $i, $t := $targets }}
            {{- $le := $t.o.latencyThreshold | default $slo.latencyThreshold }}
            {{ if $i }}or {{ end }}label_set(
              (sum(rate(http_server_requests_total{ {{- $t.sel }}, code=~"5.."}[{{ $w }}])) or sum(rate(http_server_requests_total{ {{- $t.sel }}}[{{ $w }}])) * 0)
                / sum(rate(http_server_requests_total{ {{- $t.sel }}}[{{ $w }}])),
              "job", "{{ $t.name }}", "slo", "availability", "kind", "{{ $t.kind }}")
            or label_set(
              clamp_min(1 - sum(rate(http_server_request_duration_seconds_bucket{ {{- $t.sel }}, le="{{ $le }}"}[{{ $w }}]))
                / sum(rate(http_server_request_duration_seconds_count{ {{- $t.sel }}}[{{ $w }}])), 0),
              "job", "{{ $t.name }}", "slo", "latency", "kind", "{{ $t.kind }}")
            {{- end }}
        {{- end }}
        - record: slo:sli_requests:rate5m
          expr: |
            {{- range $i, $t := $targets }}
            {{ if $i }}or {{ end }}label_set(sum(rate(http_server_requests_total{ {{- $t.sel }}}[5m])), "job", "{{ $t.name }}", "slo", "availability", "kind", "{{ $t.kind }}")
            or label_set(sum(rate(http_server_request_duration_seconds_count{ {{- $t.sel }}}[5m])), "job", "{{ $t.name }}", "slo", "latency", "kind", "{{ $t.kind }}")
            {{- end }}
        - record: slo:sli_errors:rate5m
          expr: |
            {{- range $i, $t := $targets }}
            {{- $le := $t.o.latencyThreshold | default $slo.latencyThreshold }}
            {{ if $i }}or {{ end }}label_set(
              sum(rate(http_server_requests_total{ {{- $t.sel }}, code=~"5.."}[5m])) or sum(rate(http_server_requests_total{ {{- $t.sel }}}[5m])) * 0,
              "job", "{{ $t.name }}", "slo", "availability", "kind", "{{ $t.kind }}")
            or label_set(
              clamp_min(sum(rate(http_server_request_duration_seconds_count{ {{- $t.sel }}}[5m]))
                - sum(rate(http_server_request_duration_seconds_bucket{ {{- $t.sel }}, le="{{ $le }}"}[5m])), 0),
              "job", "{{ $t.name }}", "slo", "latency", "kind", "{{ $t.kind }}")
            {{- end }}
    - name: shop-slo-budget
      interval: 1m
      rules:
        # Traffic-weighted: bad requests / all requests over 30d (an average of 5m ratios would
        # weigh a quiet 5 minutes as much as a busy one).
        - record: slo:sli_error:ratio_rate30d
          expr: sum_over_time(slo:sli_errors:rate5m[30d]) / sum_over_time(slo:sli_requests:rate5m[30d])
        - record: slo:error_budget_remaining:ratio
          expr: 1 - slo:sli_error:ratio_rate30d / on (job, slo, kind) (1 - slo:objective:ratio)
        # How much data the 30d window really holds (a staging cluster is recreated often).
        - record: slo:sli_window:seconds
          expr: count_over_time(slo:sli_requests:rate5m[30d]) * 30
{{- if .Values.alerts.enabled }}
    - name: shop-slo-alerts
      rules:
        # Page: 2% of the 30d budget spent in 1h, or 5% in 6h.
        - alert: ShopSLOBurnRateCritical
          expr: |
            (
                slo:sli_error:ratio_rate1h > on (job, slo, kind) (14.4 * (1 - slo:objective:ratio))
              and
                slo:sli_error:ratio_rate5m > on (job, slo, kind) (14.4 * (1 - slo:objective:ratio))
            ) or (
                slo:sli_error:ratio_rate6h > on (job, slo, kind) (6 * (1 - slo:objective:ratio))
              and
                slo:sli_error:ratio_rate30m > on (job, slo, kind) (6 * (1 - slo:objective:ratio))
            )
          labels:
            severity: critical
          annotations:
            summary: {{`"{{ $labels.job }} ({{ $labels.kind }}): {{ $labels.slo }} SLO is burning its error budget fast"`}}
            description: {{`"{{ $value | humanizePercentage }} of requests miss the {{ $labels.slo }} SLI. Start from the Shop — SLO Overview, then the Shop — Service dashboard of the failing service: error traces and WARN/ERROR logs."`}}
        # Ticket: 10% of the 30d budget spent in 1d, or 10% in 3d.
        - alert: ShopSLOBurnRateWarning
          expr: |
            (
                slo:sli_error:ratio_rate1d > on (job, slo, kind) (3 * (1 - slo:objective:ratio))
              and
                slo:sli_error:ratio_rate2h > on (job, slo, kind) (3 * (1 - slo:objective:ratio))
            ) or (
                slo:sli_error:ratio_rate3d > on (job, slo, kind) (1 * (1 - slo:objective:ratio))
              and
                slo:sli_error:ratio_rate6h > on (job, slo, kind) (1 * (1 - slo:objective:ratio))
            )
          labels:
            severity: warning
          annotations:
            summary: {{`"{{ $labels.job }} ({{ $labels.kind }}): {{ $labels.slo }} SLO error budget is being spent faster than planned"`}}
            description: {{`"{{ $value | humanizePercentage }} of requests miss the {{ $labels.slo }} SLI over the long window."`}}
{{- end }}
{{- end }}
{{- if .Values.dashboard.enabled }}
---
# Dashboards loaded automatically by the Grafana sidecar (searchNamespace: ALL, label grafana_dashboard=1).
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-dashboards
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: {{ .Values.dashboard.folder | quote }}
data:
  {{- range $path, $_ := .Files.Glob "dashboards/*.json" }}
  {{ base $path }}: |-
    {{- $.Files.Get $path | nindent 4 }}
  {{- end }}
{{- end }}
