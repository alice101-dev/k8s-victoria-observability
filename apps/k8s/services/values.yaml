# =============================================================================
# shop-services — values for the 6 microservices. Spec kept as small as possible (Go ~20-30MiB RSS).
# =============================================================================
image:
  # Artifact Registry <region>-docker.pkg.dev/<project>/<repo> — deliberately empty in Git (public repo):
  # injected by Argo CD from Terraform (argocd-bootstrap → root app "apps" → Application shop-services).
  registry: ""
  # Bumped by `make -C apps release TAG=...`, then commit → Argo CD syncs automatically.
  tag: "b2c7939a"
  pullPolicy: IfNotPresent

environment: staging

# OpenTelemetry — standard OTel SDK env vars (read automatically by go.opentelemetry.io/otel).
otel:
  tracesEndpoint: http://vtsingle-vmks.monitoring.svc:10428/insert/opentelemetry/v1/traces
  # 100% sampling for the demo. Production: parentbased_traceidratio + 0.05..0.2
  # (or tail sampling in an OpenTelemetry Collector to "keep all errors").
  sampler: parentbased_traceidratio
  samplerArg: "1.0"

# Defaults for all services (overridable per service).
defaults:
  replicas: 2
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  logLevel: info

services:
  api-gateway:
    env:
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8080

  user-service:
    postgres: true
    redis: true

  product-service:
    postgres: true
    redis: true
    env:
      RESTOCK_INTERVAL: 2m

  order-service:
    postgres: true
    env:
      USER_SERVICE_URL: http://user-service:8080
      PRODUCT_SERVICE_URL: http://product-service:8080
      PAYMENT_SERVICE_URL: http://payment-service:8080
      NOTIFICATION_SERVICE_URL: http://notification-service:8080

  payment-service:
    postgres: true
    redis: true
    env:
      # 10% of payments declined + random latency up to 400ms → realistic error/latency data.
      PAYMENT_FAILURE_RATE: "0.1"
      PAYMENT_MAX_LATENCY: 400ms

  notification-service:
    redis: true

# Data tier connections (apps/k8s/data).
postgres:
  # Secret created by CloudNativePG for Cluster "shop-db".
  secretName: shop-db-app
  uriKey: uri
  # Server-side limits for every application session, sent at connect time (PGOPTIONS, read by pgx
  # like libpq). A statement stuck behind a lock fails after lock_timeout with SQLSTATE 55P03 instead of
  # piling up connections; the services also set application_name (PGAPPNAME) to their own name, so
  # pg_stat_activity, the exporter metrics and the PostgreSQL logs show which service a session is.
  # Migrations run under the same limits: a migration that needs more must SET its own.
  sessionSettings:
    lock_timeout: 2s
    statement_timeout: 5s
    idle_in_transaction_session_timeout: 30s
redis:
  # Sentinel endpoints and master name (apps/k8s/data/redis.yaml); clients follow failovers.
  sentinelAddrs: redis-sentinel:26379
  masterName: shop
  secretName: redis-auth
  passwordKey: password

# Simple traffic generator (curl loop) so metrics/logs/traces always have data.
# Set enabled=false (or replicas=0) when not needed.
trafficGenerator:
  enabled: true
  image: curlimages/curl:8.16.0
  # Pause between iterations (seconds). Each iteration = 1 checkout + 2 reads.
  sleepSeconds: 1
  resources:
    requests: { cpu: 5m, memory: 16Mi }
    limits: { memory: 32Mi }

# Alerts (VMRule) & Grafana dashboards (ConfigMap, loaded by the Grafana sidecar).
alerts:
  enabled: true
dashboard:
  enabled: true
  folder: Shop

# Per-service SLOs over a 30-day window, with multi-window multi-burn-rate alerts (Google SRE workbook).
#   availability: share of requests that are not 5xx (4xx are client or business outcomes)
#   latency:      share of requests faster than latencyThreshold (must be a histogram bucket: 0.005 … 5)
slo:
  enabled: true
  availability: 0.995
  latency: 0.99
  latencyThreshold: "0.1"
  overrides:
    # Checkout path: the payment provider adds up to 400ms by design.
    api-gateway: { latencyThreshold: "0.5" }
    order-service: { latencyThreshold: "0.5" }
    payment-service: { latencyThreshold: "0.5" }
  # User journeys, measured at the edge (api-gateway): what users experience, including failures of any
  # service behind it. A service with no ready pod loses its own SLI, but the journey still burns.
  journeys:
    checkout: { method: POST, route: /api/orders, latencyThreshold: "0.5" }
    browse: { method: GET, route: "/api/products/|/api/users/", latencyThreshold: "0.1" }
