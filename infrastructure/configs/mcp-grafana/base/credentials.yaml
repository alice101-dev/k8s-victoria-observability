apiVersion: generators.external-secrets.io/v1alpha1
kind: Grafana
metadata:
  name: mcp-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  url: http://grafana.monitoring.svc
  auth:
    basic:
      username: admin
      password:
        name: grafana-admin
        key: admin-password
  serviceAccount:
    name: mcp-grafana
    role: Viewer
    secondsToLive: 604800
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-sa-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  target:
    name: mcp-grafana-sa-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Grafana
          name: mcp-grafana
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-grafana-server-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-server-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-grafana-server-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-grafana-server-token
