apiVersion: gateway.kgateway.dev/v1alpha1
kind: GatewayParameters
metadata:
  name: kgateway-public
  namespace: kgateway-system
spec:
  kube:
    deployment:
      replicas: 2
    podDisruptionBudget:
      spec:
        maxUnavailable: 1
    service:
      type: ClusterIP
    podTemplate:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              gateway.networking.k8s.io/gateway-name: kgateway-public
    envoyContainer:
      resources:
        requests: { cpu: 50m, memory: 64Mi }
        limits: { memory: 256Mi }
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: kgateway-public
  namespace: kgateway-system
spec:
  gatewayClassName: kgateway
  infrastructure:
    parametersRef:
      group: gateway.kgateway.dev
      kind: GatewayParameters
      name: kgateway-public
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Selector
          selector:
            matchLabels:
              platform/gateway: kgateway-public
