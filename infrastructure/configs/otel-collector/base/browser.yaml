apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: browser-telemetry
  namespace: monitoring
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: Gateway
      name: edge
      namespace: kgateway-system
      sectionName: http
  rules:
    - matches:
        - path:
            type: Exact
            value: /otlp/v1/traces
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/traces
      backendRefs:
        - group: ""
          kind: Service
          name: otel-collector
          port: 4319
          weight: 1
    - matches:
        - path:
            type: Exact
            value: /otlp/v1/logs
          method: POST
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplaceFullPath
              replaceFullPath: /v1/logs
      backendRefs:
        - group: ""
          kind: Service
          name: otel-collector
          port: 4319
          weight: 1
---
apiVersion: gateway.kgateway.dev/v1alpha1
kind: TrafficPolicy
metadata:
  name: browser-telemetry
  namespace: monitoring
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: browser-telemetry
  rateLimit:
    local:
      tokenBucket:
        maxTokens: 200
        tokensPerFill: 50
        fillInterval: 1s
  buffer:
    maxRequestSize: 1Mi
