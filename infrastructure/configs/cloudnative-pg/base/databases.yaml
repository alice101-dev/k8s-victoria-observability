apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: deus-db-identity-migrator
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deus-db-identity-migrator
spec:
  refreshPolicy: CreatedOnce
  target:
    name: deus-db-identity-migrator
    creationPolicy: Owner
    immutable: true
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: identity_migrator
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: deus-db-identity-migrator
---
