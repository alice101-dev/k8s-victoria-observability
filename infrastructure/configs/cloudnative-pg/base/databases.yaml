apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: deus-db-identity-migrator
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deus-db-identity-migrator
spec:
  refreshPolicy: CreatedOnce
  target:
    name: deus-db-identity-migrator
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: identity_migrator
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: deus-db-identity-migrator
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: deus-db-identity-app
spec:
  length: 40
  digits: 10
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: deus-db-identity-app
spec:
  refreshPolicy: CreatedOnce
  target:
    name: deus-db-identity-app
    creationPolicy: Owner
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      engineVersion: v2
      data:
        username: identity_app
        password: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: deus-db-identity-app
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: deus-db-identity
spec:
  cluster:
    name: deus-db
  name: identity
  owner: identity_migrator
  ensure: present
  databaseReclaimPolicy: retain
