---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: deus-db-identity
spec:
  cluster:
    name: deus-db
  name: identity
  owner: identity_migrator
  ensure: present
  databaseReclaimPolicy: retain
