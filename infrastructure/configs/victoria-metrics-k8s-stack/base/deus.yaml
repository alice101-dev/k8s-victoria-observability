    - name: deus-slo-budget
      interval: 1m
      rules:
        - record: slo:sli_error:ratio_rate30d
          expr: "sum_over_time(slo:sli_errors:rate5m[30d]) / sum_over_time(slo:sli_requests:rate5m[30d])"
        - record: slo:error_budget_remaining:ratio
          expr: "1 - slo:sli_error:ratio_rate30d / on (target, slo, kind) (1 - slo:objective:ratio)"
        - record: slo:sli_window:seconds
          expr: "count_over_time(slo:sli_requests:rate5m[30d]) * 30"
    - name: deus-slo-alerts
      rules:
        - alert: DeusSLOBurnRateCritical
          expr: |
            (slo:sli_error:ratio_rate1h > on (target, slo, kind) (14.4 * (1 - slo:objective:ratio)) and slo:sli_error:ratio_rate5m > on (target, slo, kind) (14.4 * (1 - slo:objective:ratio))) or (slo:sli_error:ratio_rate6h > on (target, slo, kind) (6 * (1 - slo:objective:ratio)) and slo:sli_error:ratio_rate30m > on (target, slo, kind) (6 * (1 - slo:objective:ratio)))
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.target }} ({{ $labels.kind }}): {{ $labels.slo }} SLO is burning its error budget fast"
            description: |
              {{ $value | humanizePercentage }} of requests miss the {{ $labels.slo }} SLI. Start from Deus — SLO Overview, then Deus — Service of the failing service: its error logs and traces.
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deussloburnratecritical
        - alert: DeusSLOBurnRateWarning
          expr: |
            (slo:sli_error:ratio_rate1d > on (target, slo, kind) (3 * (1 - slo:objective:ratio)) and slo:sli_error:ratio_rate2h > on (target, slo, kind) (3 * (1 - slo:objective:ratio))) or (slo:sli_error:ratio_rate3d > on (target, slo, kind) (1 * (1 - slo:objective:ratio)) and slo:sli_error:ratio_rate6h > on (target, slo, kind) (1 * (1 - slo:objective:ratio)))
          labels:
            severity: warning
          annotations:
            summary: |
              {{ $labels.target }} ({{ $labels.kind }}): {{ $labels.slo }} SLO error budget is spent faster than planned
            description: "{{ $value | humanizePercentage }} of requests miss the {{ $labels.slo }} SLI over the long window."
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deussloburnratewarning
    - name: deus
      rules:
        - alert: DeusServiceDown
          expr: |
            (max by (namespace, deployment) (kube_deployment_status_replicas_available{namespace=~"(.+-)?deus"})) * on (namespace, deployment) group_left () max by (namespace, deployment) (kube_deployment_labels{namespace=~"(.+-)?deus", label_app_kubernetes_io_part_of="deus"}) == 0
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "{{ $labels.deployment }} has no available replica"
            description: |
              Every request to {{ $labels.deployment }} fails, and its own SLI stops moving because no request reaches it. Check the pod events, the migration Job and the startup logs.
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deusservicedown
        - alert: DeusOutboxDeadEvents
          expr: "max by (service_name) (outbox_backlog{service_namespace=\"deus\", outbox_state=\"dead\"}) > 0"
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} has {{ $value }} outbox events that will not be retried"
            description: |
              The receiving service rejected these events (400, 404, 422) or they used every attempt. The documents they belong to are missing in the receiving service until someone replays or fixes them.
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deusoutboxdeadevents
        - alert: DeusOutboxBacklog
          expr: "max by (service_name) (outbox_backlog{service_namespace=\"deus\", outbox_state=\"pending\"}) > 50"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} has {{ $value }} outbox events waiting"
            description: |
              Events are written faster than they are delivered, or the receiving service is down: journals, allocations or emails arrive late.
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deusoutboxbacklog
        - alert: DeusDatabasePoolExhausted
          expr: "max by (service_name) (db_client_connection_pending_requests{service_namespace=\"deus\"}) > 0"
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.service_name }} requests wait for a database connection"
            description: |
              Every connection of the pool is in use for 10 minutes. Requests queue and slow down; check slow queries and DB_MAX_CONNECTIONS.
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deusdatabasepoolexhausted
    - name: deus-logs
      type: vlogs
      interval: 5m
      rules:
        - alert: DeusErrorLogsSpike
          expr: |
            service.namespace:=deus severity_text:=ERROR | stats by (service.name) count() as error_logs | filter error_logs:>20
          labels:
            severity: warning
          annotations:
            summary: "{{ index $labels \"service.name\" }}: {{ $value }} ERROR logs in 5 minutes"
            description: |
              Open Deus — Logs for the service, or query VictoriaLogs: service.namespace:=deus severity_text:=ERROR
            runbook_url: |
              https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/deus.md#deuserrorlogsspike
