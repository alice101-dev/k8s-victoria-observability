apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: deus
  namespace: monitoring
spec:
  groups:
    - name: deus-slo-sli
      interval: 30s
      rules:
        - record: slo:objective:ratio
          expr: |
            0 * sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[5m]), "target", "$1", "service_name", "(.+)")) + 0.995
          labels:
            kind: service
            slo: availability
        - record: slo:sli_threshold:seconds
          expr: |
            0 * sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[5m]), "target", "$1", "service_name", "(.+)")) + 0
          labels:
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate5m
          expr: |
            (sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting", http_response_status_code=~"5.."}[5m]), "target", "$1", "service_name", "(.+)")) or sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[5m]), "target", "$1", "service_name", "(.+)")) * 0) / sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[5m]), "target", "$1", "service_name", "(.+)"))
