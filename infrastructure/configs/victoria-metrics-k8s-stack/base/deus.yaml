apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: deus
  namespace: monitoring
spec:
  groups:
    - name: deus-slo-sli
      interval: 30s
      rules:
        - record: slo:objective:ratio
          expr: "vector(0.995)"
          labels:
            target: accounts
            kind: service
            slo: availability
        - record: slo:sli_threshold:seconds
          expr: "vector(0)"
          labels:
            target: accounts
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate5m
          expr: |
            (sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts", http_response_status_code=~"5.."}[5m])) or sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[5m])) * 0) / sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[5m]))
          labels:
            target: accounts
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate30m
          expr: |
            (sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts", http_response_status_code=~"5.."}[30m])) or sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[30m])) * 0) / sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[30m]))
          labels:
            target: accounts
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate1h
          expr: |
            (sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts", http_response_status_code=~"5.."}[1h])) or sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[1h])) * 0) / sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[1h]))
          labels:
            target: accounts
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate2h
          expr: |
            (sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts", http_response_status_code=~"5.."}[2h])) or sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[2h])) * 0) / sum(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name="accounts"}[2h]))
