            clamp_min(1 - sum by (target) (label_replace(rate(http_server_request_duration_seconds_bucket{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting", le="0.5"}[5m]), "target", "$1", "service_name", "(.+)")) / sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[5m]), "target", "$1", "service_name", "(.+)")), 0)
