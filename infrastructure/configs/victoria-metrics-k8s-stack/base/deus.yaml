          expr: |
            (sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting", http_response_status_code=~"5.."}[30m]), "target", "$1", "service_name", "(.+)")) or sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[30m]), "target", "$1", "service_name", "(.+)")) * 0) / sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[30m]), "target", "$1", "service_name", "(.+)"))
          labels:
            kind: service
            slo: availability
        - record: slo:sli_error:ratio_rate1h
          expr: |
            (sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting", http_response_status_code=~"5.."}[1h]), "target", "$1", "service_name", "(.+)")) or sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[1h]), "target", "$1", "service_name", "(.+)")) * 0) / sum by (target) (label_replace(rate(http_server_request_duration_seconds_count{service_namespace="deus", http_route!~"/openapi.*", service_name!~"identity|payments|reporting"}[1h]), "target", "$1", "service_name", "(.+)"))
