apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-argocd-server-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-argocd-server-token
  namespace: monitoring
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-argocd-server-token
    creationPolicy: Owner
    immutable: true
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-argocd-server-token
