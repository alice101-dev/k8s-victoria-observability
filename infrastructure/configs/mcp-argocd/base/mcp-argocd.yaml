apiVersion: v1
kind: ServiceAccount
metadata:
  name: mcp-argocd
  namespace: monitoring
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-argocd
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mcp-argocd
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mcp-argocd
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mcp-argocd
    spec:
      serviceAccountName: mcp-argocd
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mcp
          image: ghcr.io/argoproj-labs/mcp-for-argocd:v0.9.0
          args: ["http", "--allowed-host-header", "localhost"]
          env:
            - name: ARGOCD_BASE_URL
              value: http://argocd-server.argocd.svc.cluster.local.
            - name: ARGOCD_API_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-argocd-token
                  key: token
            - name: MCP_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: mcp-argocd-server-token
                  key: token
            - name: MCP_BIND_ADDRESS
              value: 0.0.0.0
            - name: MCP_READ_ONLY
              value: "true"
          ports:
            - name: http
              containerPort: 3000
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests: { cpu: 10m, memory: 64Mi }
            limits: { memory: 256Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-argocd
  namespace: monitoring
  labels:
    app.kubernetes.io/name: mcp-argocd
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: mcp-argocd
  ports:
    - name: http
      port: 3000
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mcp-argocd
  namespace: monitoring
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mcp-argocd
  policyTypes: [Ingress]
  ingress: []
