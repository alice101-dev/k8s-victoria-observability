  - name: deus-service-dashboard
    files:
      - dashboards/deus-service.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Deus
  - name: deus-logs-dashboard
    files:
      - dashboards/deus-logs.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
