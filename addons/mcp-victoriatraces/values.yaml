fullnameOverride: vt-mcp

image:
  tag: v1.5.0

vt:
  entrypoint: http://vtsingle-vmks.monitoring.svc:10428

mcp:
  mode: http

service:
  type: ClusterIP
  port: 8080

scrape:
  enabled: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]

resources:
  requests: { cpu: 10m, memory: 128Mi }
  limits: { memory: 512Mi }

startupProbe:
  httpGet:
    path: /health/liveness
    port: http
  periodSeconds: 10
  failureThreshold: 30
