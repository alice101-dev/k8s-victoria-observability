controller:
  replicaCount: 1
  logLevel: info
  podSecurityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  securityContext:
    allowPrivilegeEscalation: false
    readOnlyRootFilesystem: true
    capabilities:
      drop: ["ALL"]
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { memory: 512Mi }
discoveryNamespaceSelectors:
  - matchLabels:
      platform/gateway: edge
  - matchExpressions:
      - key: kubernetes.io/metadata.name
        operator: In
        values: [kgateway-system, monitoring]
