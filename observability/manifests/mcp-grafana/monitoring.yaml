# mcp-grafana /metrics on its side listener (:9090, --metrics-address). The chart only ships a
# prometheus-operator ServiceMonitor (not used here) and declares no container port for 9090, so
# discover the pod through mcp-http and point the target at <pod-ip>:9090.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMPodScrape
metadata:
  name: grafana-mcp
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana-mcp
      app.kubernetes.io/component: mcp-server
  podMetricsEndpoints:
    - port: mcp-http
      path: /metrics
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_pod_ip]
          targetLabel: __address__
          replacement: "${1}:9090"
