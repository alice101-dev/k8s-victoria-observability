# Credentials for mcp-grafana, generated by External Secrets — nothing is stored in Git.
# Sync wave -1 inside the Application: Secrets exist before the Deployment starts.

# Grafana service account "mcp-grafana" (Viewer) and its token, created through the Grafana API
# with the admin credentials. A new token every 24h; ESO revokes the previous one, and tokens
# expire after 7 days even if a rotation fails.
apiVersion: generators.external-secrets.io/v1alpha1
kind: Grafana
metadata:
  name: mcp-grafana
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  url: http://grafana.monitoring.svc
  auth:
    basic:
      username: admin
      password:
        name: grafana-admin
        key: admin-password
  serviceAccount:
    name: mcp-grafana
    role: Viewer
    secondsToLive: 604800
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-sa-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 24h
  target:
    name: mcp-grafana-sa-token
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Grafana
          name: mcp-grafana
---
# Bearer token MCP clients send to mcp-grafana (caller authentication). Generated once.
# Get it: kubectl -n monitoring get secret mcp-grafana-server-token -o jsonpath='{.data.token}' | base64 -d
apiVersion: generators.external-secrets.io/v1alpha1
kind: Password
metadata:
  name: mcp-grafana-server-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  length: 48
  digits: 12
  symbols: 0
  noUpper: false
  allowRepeat: true
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-grafana-server-token
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshPolicy: CreatedOnce
  target:
    name: mcp-grafana-server-token
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        token: "{{ .password }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: mcp-grafana-server-token
