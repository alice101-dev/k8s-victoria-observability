apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitoring.yaml
  - pipeline.yaml

# Dashboards generated by apps/k8s/services/dashboards/generator/ (platform.py, pipeline.py), loaded by the Grafana
# sidecar into the "Platform" folder.
configMapGenerator:
  - name: platform-gitops-secrets-dashboard
    files:
      - dashboards/platform-gitops-secrets.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
  - name: observability-pipeline-dashboard
    files:
      - dashboards/observability-pipeline.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
