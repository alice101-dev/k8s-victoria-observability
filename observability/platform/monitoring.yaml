# Metrics of the platform components: Argo CD (installed by Terraform), External Secrets and cert-manager.
# The scrape objects live in monitoring and select the Services in the components' namespaces; vmagent discovers
# them automatically (selectAllByDefault) and its ClusterRole reads endpoints in every namespace. Job label =
# Service name. honorLabels: the metrics describe objects in other namespaces (Applications, ExternalSecrets,
# Certificates) and keep their own namespace label instead of an exported_namespace copy.
#
# Argo CD: application controller (8082), API server (8083), repo-server (8084), enabled by
# terraform/modules/argocd-bootstrap (controller/server/repoServer.metrics.enabled).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: argocd
spec:
  namespaceSelector:
    matchNames: [argocd]
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [argocd-metrics, argocd-server-metrics, argocd-repo-server-metrics]
  endpoints:
    - port: http-metrics
      honorLabels: true
      metricRelabelConfigs:
        # Per-method gRPC counters of the API server (~340 series) that grpc_server_handled_total already covers.
        - action: drop
          sourceLabels: [__name__]
          regex: grpc_server_(started|msg_received|msg_sent)_total
---
# External Secrets: controller, webhook and cert-controller (metrics Services enabled in
# observability/values/external-secrets.yaml).
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: external-secrets
spec:
  namespaceSelector:
    matchNames: [external-secrets]
  selector:
    matchLabels:
      app.kubernetes.io/instance: external-secrets
  endpoints:
    - port: metrics
      honorLabels: true
---
# cert-manager: controller and cainjector (port http-metrics), webhook (port metrics), all on 9402.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMServiceScrape
metadata:
  name: cert-manager
spec:
  namespaceSelector:
    matchNames: [cert-manager]
  selector:
    matchLabels:
      app.kubernetes.io/instance: cert-manager
  endpoints:
    - port: http-metrics
      honorLabels: true
    - port: metrics
      honorLabels: true
---
# Alerts on GitOps delivery, secret sync and certificates. Every rule links to docs/runbooks/platform.md.
apiVersion: operator.victoriametrics.com/v1beta1
kind: VMRule
metadata:
  name: platform
spec:
  groups:
    - name: argocd
      rules:
        # A sync operation ends Failed or Error once its retries (10, backoff up to 5 minutes) are used up.
        - alert: ArgoCdAppSyncFailed
          expr: sum by (name, project, phase) (round(increase(argocd_app_sync_total{phase=~"Error|Failed", dry_run="false"}[10m]))) > 0
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }}: sync {{ $labels.phase }}"
            description: The last sync of {{ $labels.name }} (project {{ $labels.project }}) did not complete; the cluster does not match Git. The operation message says which resource failed.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdappsyncfailed
        # Automated sync with selfHeal reverts drift within seconds: OutOfSync for 15 minutes means syncs fail or a
        # field differs on every sync (a controller or webhook rewrites it). Unknown = manifests could not be built.
        - alert: ArgoCdAppOutOfSync
          expr: max by (name, project, sync_status) (argocd_app_info{sync_status!="Synced"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.sync_status }} for 15 minutes"
            description: The live state of {{ $labels.name }} (project {{ $labels.project }}) differs from Git and Argo CD does not converge it. Changes merged to Git are not deployed.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdappoutofsync
        - alert: ArgoCdAppUnhealthy
          expr: max by (name, project, health_status) (argocd_app_info{health_status!~"Healthy|Progressing"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD application {{ $labels.name }} is {{ $labels.health_status }}"
            description: At least one resource of {{ $labels.name }} (project {{ $labels.project }}) is Degraded, Missing or of unknown health for 15 minutes.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdappunhealthy
        # Every Application of this repository syncs automatically; disabled = someone switched it off by hand.
        - alert: ArgoCdAppAutoSyncDisabled
          expr: max by (name, project) (argocd_app_info{autosync_enabled!="true"}) == 1
          for: 2h
          labels:
            severity: info
          annotations:
            summary: "Argo CD application {{ $labels.name }} has automated sync disabled"
            description: Git changes to {{ $labels.name }} are no longer applied and drift is no longer reverted.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdappautosyncdisabled
        # ls-remote runs on every refresh (3 minutes), so a broken repository keeps the 10-minute window non-zero.
        # Not by repo: Argo CD v3.5 labels these counters with the local checkout path, not the repository URL.
        - alert: ArgoCdGitRequestsFailing
          expr: sum(increase({__name__=~"argocd_git_(fetch|lsremote)_fail_total"}[10m])) > 0
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Argo CD Git requests keep failing ({{ $value | humanize }} in 10 minutes)"
            description: The repo-server's git fetch or ls-remote keeps failing (network, credentials, or the repository or revision is gone); the applications reading that repository are Unknown with a ComparisonError. New commits are not deployed.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdgitrequestsfailing
        - alert: ArgoCdControllerDown
          expr: absent(up{job="argocd-application-controller-metrics"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No metrics from the Argo CD application controller
            description: The controller is down or no longer scraped. Nothing is synced or self-healed, and the Argo CD alerts are blind.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#argocdcontrollerdown
    - name: external-secrets
      rules:
        # Not Ready: the last refresh failed. The target Secret keeps its previous data, so workloads keep running;
        # a missing Secret (first sync) makes their pods fail to start.
        - alert: ExternalSecretNotSynced
          expr: max by (namespace, name) (externalsecret_status_condition{condition="Ready", status!="True"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "ExternalSecret {{ $labels.namespace }}/{{ $labels.name }} is not synced"
            description: External Secrets cannot read or generate the data of {{ $labels.namespace }}/{{ $labels.name }} for 15 minutes. The Secret keeps its last data; new or rotated values do not arrive.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#externalsecretnotsynced
        - alert: SecretStoreNotReady
          expr: (max by (namespace, name) (secretstore_status_condition{condition="Ready", status!="True"}) == 1) or (max by (name) (clustersecretstore_status_condition{condition="Ready", status!="True"}) == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Secret store {{ with $labels.namespace }}{{ . }}/{{ end }}{{ $labels.name }} is not ready"
            description: External Secrets cannot authenticate to the provider (for GCP Secret Manager, Workload Identity or IAM). Every ExternalSecret using this store stops syncing.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#secretstorenotready
        - alert: ExternalSecretsControllerDown
          expr: absent(up{job="external-secrets-metrics"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No metrics from the External Secrets controller
            description: The controller is down or no longer scraped. Secrets are not refreshed or created, and the External Secrets alerts are blind.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#externalsecretscontrollerdown
    - name: cert-manager
      rules:
        - alert: CertManagerCertificateNotReady
          expr: max by (namespace, name, issuer_name) (certmanager_certificate_ready_status{condition!="True"}) == 1
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} is not ready"
            description: cert-manager cannot issue or renew the certificate (issuer {{ $labels.issuer_name }}); its Secret may be missing or outdated.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#certmanagercertificatenotready
        # Renewal is due at the renewal time (renewBefore ahead of expiry) and takes seconds to minutes. Relative to
        # each certificate's own renewal time, so it fits every duration (a fixed "expires in < 21 days" would fire
        # during the normal renewal window of 90-day certificates renewed 15 days ahead). The timestamps are 0 until
        # a certificate is first issued: that case is CertManagerCertificateNotReady, so "> 0" leaves it out.
        - alert: CertManagerCertificateRenewalOverdue
          expr: (time() - max by (namespace, name, issuer_name) (certmanager_certificate_renewal_timestamp_seconds > 0)) > 3600
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }}: renewal overdue by {{ $value | humanizeDuration }}"
            description: The certificate should have been renewed (issuer {{ $labels.issuer_name }}) but was not; it keeps working until it expires.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#certmanagercertificaterenewaloverdue
        - alert: CertManagerCertificateExpiringSoon
          expr: (max by (namespace, name, issuer_name) (certmanager_certificate_expiration_timestamp_seconds > 0) - time() < 7 * 86400) and on (namespace, name) (time() - max by (namespace, name) (certmanager_certificate_renewal_timestamp_seconds > 0) > 0)
          labels:
            severity: critical
          annotations:
            summary: "Certificate {{ $labels.namespace }}/{{ $labels.name }} expires in {{ $value | humanizeDuration }}"
            description: The renewal is overdue and the certificate expires within 7 days. When it expires, TLS to the service fails (CloudNativePG backups through the Barman Cloud plugin stop).
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#certmanagercertificateexpiringsoon
        - alert: CertManagerIssuerNotReady
          expr: (max by (namespace, name) (certmanager_issuer_ready_status{condition!="True"}) == 1) or (max by (name) (certmanager_clusterissuer_ready_status{condition!="True"}) == 1)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Issuer {{ with $labels.namespace }}{{ . }}/{{ end }}{{ $labels.name }} is not ready"
            description: Certificates of this issuer can be neither issued nor renewed.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#certmanagerissuernotready
        - alert: CertManagerDown
          expr: absent(up{job="cert-manager"} == 1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: No metrics from the cert-manager controller
            description: The controller is down or no longer scraped. Certificates are not issued or renewed, and the cert-manager alerts are blind.
            runbook_url: https://github.com/alice101-dev/k8s-victoria-observability/blob/main/docs/runbooks/platform.md#certmanagerdown
