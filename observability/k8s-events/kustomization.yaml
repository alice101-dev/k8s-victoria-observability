apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
resources:
  - monitoring.yaml

# "Cluster — Events" dashboard (generated by apps/k8s/services/dashboards/generate.py), loaded by the Grafana
# sidecar into the "Platform" folder.
configMapGenerator:
  - name: cluster-events-dashboard
    files:
      - dashboards/cluster-events.json
    options:
      disableNameSuffixHash: true
      labels:
        grafana_dashboard: "1"
      annotations:
        grafana_folder: Platform
