# Workaround for an upstream bug: the k8s_events receiver (and k8sobjects in watch mode) stops receiving events
# without any log line once the API server ends its watch (after 30-60 minutes); only a restart recovers it.
# https://github.com/open-telemetry/opentelemetry-collector-contrib/issues/51982 (fix pending in PR #51082 and
# the informer observer of PR #52028). Restarting every 20 minutes keeps it ahead of the first watch timeout;
# the rolling restart starts the new pod before the old one stops, so events are duplicated for a few seconds
# rather than lost. KubeEventsCollectorStalled alerts if events still stop. Remove once the fix is released.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: k8s-events-restarter
---
# May only restart the collector Deployment.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: k8s-events-restarter
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["k8s-events"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: k8s-events-restarter
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: k8s-events-restarter
subjects:
  - kind: ServiceAccount
    name: k8s-events-restarter
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: k8s-events-restarter
spec:
  schedule: "*/20 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 300
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          serviceAccountName: k8s-events-restarter
          restartPolicy: Never
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: restart
              image: registry.k8s.io/kubectl:v1.35.0
              command: ["kubectl", "rollout", "restart", "deployment/k8s-events"]
              env:
                - name: HOME  # kubectl's discovery cache
                  value: /tmp
              volumeMounts:
                - name: tmp
                  mountPath: /tmp
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
          volumes:
            - name: tmp
              emptyDir: {}
