# Wave 1: Kubernetes events → VictoriaLogs (OpenTelemetry Collector, k8s_events receiver), plus the
# "Cluster — Events" dashboard, the event alerts and the collector's scrape config (observability/k8s-events).
# After the stack (wave 0): it writes to vlinsert and uses the VMRule / VMPodScrape CRDs.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: k8s-events
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://open-telemetry.github.io/opentelemetry-helm-charts
      chart: opentelemetry-collector
      targetRevision: {{ .Values.charts.otelCollector }}
      helm:
        valueFiles:
          - $values/observability/values/otel-k8s-events.yaml
    - repoURL: {{ include "app.repoURL" . }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
    - repoURL: {{ include "app.repoURL" . }}
      targetRevision: {{ .Values.targetRevision }}
      path: observability/k8s-events
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # The k8s-events-restarter CronJob restarts the collector (kubectl rollout restart): not a drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: k8s-events
      jsonPointers:
        - /spec/template/metadata/annotations/kubectl.kubernetes.io~1restartedAt
  {{- include "app.syncPolicy" . | nindent 2 }}
