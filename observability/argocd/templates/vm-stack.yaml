# Wave 0: observability stack — VMCluster, VLCluster + VLAgent, VTCluster, vmagent, vmalert,
# alertmanager, Grafana, kube-state-metrics, node-exporter, dashboards & rules.
# Application name = Helm release name ("vm-stack"); deliberately NO helm.releaseName so the
# chart's VMServiceScrape selectors still match (see argocdReleaseOverride in the chart docs).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vm-stack
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://victoriametrics.github.io/helm-charts/
      chart: victoria-metrics-k8s-stack
      targetRevision: {{ .Values.charts.vmK8sStack }}
      helm:
        valueFiles:
          - $values/observability/values/vm-k8s-stack.yaml
    - repoURL: {{ include "app.repoURL" . }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  {{- include "app.syncPolicy" . | nindent 2 }}
