# Wave -3: External Secrets Operator (CRDs + controller). Used by observability (Grafana admin)
# and apps (Redis password) to generate random secrets without storing values in Git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: {{ .Values.project }}
  sources:
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: {{ .Values.charts.externalSecrets }}
      helm:
        valueFiles:
          - $values/observability/values/external-secrets.yaml
    - repoURL: {{ include "app.repoURL" . }}
      targetRevision: {{ .Values.targetRevision }}
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  # Webhook caBundle and cert are injected by cert-controller at runtime → not drift.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
    - group: ""
      kind: Secret
      name: external-secrets-webhook
      namespace: external-secrets
      jsonPointers:
        - /data
  {{- include "app.syncPolicy" . | nindent 2 }}
