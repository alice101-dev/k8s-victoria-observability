# =============================================================================
# victoria-metrics-k8s-stack — production values for GKE
# Chart    : vm/victoria-metrics-k8s-stack 0.96.0
# Contents : VMSingle (metrics) + VLSingle/VLAgent (logs) + VTSingle (traces), single-node mode
#            + vmagent + vmalert + alertmanager + Grafana + kube-state-metrics + node-exporter
# The VictoriaMetrics operator is installed SEPARATELY (vm-operator Application), as the docs
# recommend: CRD/operator upgrades and removal are controlled independently of the stack.
# =============================================================================

# Short name keeps resource names under the 63-char limit (chart docs recommendation).
# All CRs are named "vmks" → services: vmsingle-vmks, vlsingle-vmks, vtsingle-vmks, vmagent-vmks, ...
nameOverride: vmks
fullnameOverride: vmks

global:
  clusterLabel: cluster
  # Default component versions (operator defaults for CRs without an explicit image tag). The chart
  # itself takes the VictoriaMetrics tag from its appVersion (v1.154.0), so VMSingle, vmagent, vmalert and
  # the internal vmauth set image.tag to the latest patch release explicitly.
  versions:
    metrics: v1.154.1
    logs: v1.53.0
    traces: v0.12.0
    alertmanager: v0.34.1

# The operator is installed by the vm-operator Application.
victoria-metrics-operator:
  enabled: false

# Grafana is reached via `kubectl port-forward svc/grafana 3000:80`; vmalert alert links use this.
external:
  grafana:
    host: localhost:3000

# Internal vmauth: routes vmalert queries (/select/logsql → VLSingle, the rest → VMSingle).
# It sits on the rule evaluation path, so 2 replicas avoid an alerting SPOF.
internal:
  vmauth:
    spec:
      image:
        tag: v1.154.1
      replicaCount: 2
      podDisruptionBudget:
        maxUnavailable: 1
      resources:
        requests: { cpu: 10m, memory: 32Mi }
        limits: { memory: 128Mi }

# -----------------------------------------------------------------------------
# Dashboards & rules — fetched by the sync job at deploy time. URLs are PINNED to the release
# tags matching the component versions (chart defaults point at master = not deterministic).
# -----------------------------------------------------------------------------
defaultDashboards:
  enabled: true
  # All dashboards of the chart go to the Grafana folder "Platform" (the chart sets one annotation for all of
  # them); application dashboards ship their own ConfigMaps with folder "Shop".
  annotations:
    grafana_folder: Platform
  dashboards:
    # The operator is installed separately, but its dashboard is still used.
    victoriametrics-operator:
      enabled: true
      clusterMetric: vm_app_version
    # Not relevant for this cluster (one GKE cluster, Linux nodes only).
    k8s-resources-multicluster: { enabled: false }
    k8s-resources-windows-cluster: { enabled: false }
    k8s-resources-windows-namespace: { enabled: false }
    k8s-resources-windows-pod: { enabled: false }
    k8s-windows-cluster-rsrc-use: { enabled: false }
    k8s-windows-node-rsrc-use: { enabled: false }
    nodes-aix: { enabled: false }
    nodes-darwin: { enabled: false }
  sources:
    victoriatraces-single-node:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaTraces/v0.12.0/dashboards/victoriatraces.json
    victorialogs-single-node:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.53.0/dashboards/victorialogs.json
    victorialogs-vlagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.53.0/dashboards/vlagent.json
    victoriametrics-vmagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/dashboards/vmagent.json
    victoriametrics-single-node:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/dashboards/victoriametrics.json
    victoriametrics-vmalert:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/dashboards/vmalert.json
    victoriametrics-operator:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/dashboards/operator.json
      enabled: true
    kubernetes-views-global:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-global.json
    kubernetes-views-namespaces:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-namespaces.json
    kubernetes-views-pods:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-pods.json
    kubernetes-views-nodes:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-views-nodes.json
    kubernetes-system-api-server:
      url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/v3.0.8/dashboards/k8s-system-api-server.json
    node-exporter-full:
      url: https://raw.githubusercontent.com/rfmoz/grafana-dashboards/b173daed1bb163ca320cc3624206e07832219113/prometheus/node-exporter-full.json
    kube-prometheus:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/grafana-dashboardDefinitions.yaml
    # Application data tier dashboards. CloudNativePG is vendored with fixes in apps/k8s/data/dashboards.
    redis-exporter:
      url: https://raw.githubusercontent.com/oliver006/redis_exporter/v1.93.0/contrib/grafana_prometheus_redis_dashboard.json

defaultRules:
  enabled: true
  sources:
    alertmanager:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/alertmanager-prometheusRule.yaml
    kubernetes-control-plane:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubernetesControlPlane-prometheusRule.yaml
    kubernetes:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubePrometheus-prometheusRule.yaml
    kube-state-metrics:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/kubeStateMetrics-prometheusRule.yaml
    node-exporter:
      url: https://raw.githubusercontent.com/prometheus-operator/kube-prometheus/v0.19.0/manifests/nodeExporter-prometheusRule.yaml
    vmhealth:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/deployment/docker/rules/alerts-health.yml
    vmagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/deployment/docker/rules/alerts-vmagent.yml
    vmalert:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/deployment/docker/rules/alerts-vmalert.yml
    vmsingle:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.1/deployment/docker/rules/alerts-single-node.yml
    vmoperator:
      url: https://raw.githubusercontent.com/VictoriaMetrics/operator/v0.75.1/config/alerting/vmoperator-rules.yaml
      enabled: true
    vlhealth:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.53.0/deployment/docker/rules/alerts-health.yml
    vlagent:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.53.0/deployment/docker/rules/alerts-vlagent.yml
    victorialogs:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaLogs/v1.53.0/deployment/docker/rules/alerts-vlogs.yml
    victoriatraces:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaTraces/v0.12.0/deployment/docker/rules/alerts-vtraces.yml
    vthealth:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaTraces/v0.12.0/deployment/docker/rules/alerts-health.yml

syncJob:
  resources:
    requests: { cpu: 10m, memory: 64Mi }
    limits: { memory: 256Mi }

# =============================================================================
# METRICS — VMSingle: one process ingests, stores and queries; 30-day retention.
# Single-node handles far more than this cluster sends (the case studies in the docs run 100k+
# active series and tens of thousands of samples/s on one node) with fewer moving parts than a cluster.
# Durability comes from the GCE persistent disk. No HA: while the pod restarts (e.g. a Spot
# preemption, ~2 minutes) queries fail and alert evaluation pauses; both vmagents keep the samples in
# their persistent queues and resend them, so nothing is lost.
# =============================================================================
vmsingle:
  enabled: true
  spec:
    image:
      tag: v1.154.1
    retentionPeriod: "30d"
    # Data is deleted per monthly partition, so the disk holds up to retention + 1 month (docs,
    # Retention). ~4.5k samples/s today (137k active series, 30s scrape) ≈ 7-10GB a month → 30Gi to
    # start; grow it online by raising the size (standard-rwo allows volume expansion). The
    # DiskRunsOutOfSpaceIn3Days alert (vmhealth rules) warns well before it fills up.
    storage:
      storageClassName: standard-rwo # pd-balanced (GKE default CSI)
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 30Gi
    # The PVC goes with the VMSingle: clean teardown, no orphaned disks.
    removePvcAfterDelete: true
    extraArgs:
      # Drop duplicate samples from the 2 HA vmagent replicas. Must equal scrapeInterval.
      dedup.minScrapeInterval: 30s
      # Stop accepting data before the disk is completely full (background merges need room).
      storage.minFreeDiskSpaceBytes: "2GB"
      # Cardinality limiter: excess series are dropped and logged instead of exhausting memory.
      storage.maxHourlySeries: "500000"
      storage.maxDailySeries: "1500000"
      # Default is 2×CPU concurrent queries with no per-query memory cap → one wide query (7-day
      # dashboard, AI assistant via MCP) could OOM the process. Total ≈ 8 × 128MB < 2Gi limit.
      search.maxConcurrentRequests: "8"
      search.maxMemoryPerQuery: "128MB"
    resources:
      requests: { cpu: 200m, memory: 1Gi }
      limits: { memory: 2Gi }

vmcluster:
  enabled: false

# vmagent HA: 2 identical replicas scrape the same targets; VMSingle dedup drops duplicates.
vmagent:
  enabled: true
  spec:
    image:
      tag: v1.154.1
    replicaCount: 2
    scrapeInterval: 30s
    externalLabels:
      cluster: staging-gke
    extraArgs:
      promscrape.streamParse: "true"
      # Keep failed targets visible in /targets for troubleshooting.
      promscrape.dropOriginalLabels: "false"
    # StatefulSet + PVC for the remote-write persistent queue: buffered samples survive pod
    # rescheduling (e.g. spot preemption) while VMSingle is unreachable, instead of being lost
    # with an emptyDir.
    statefulMode: true
    statefulStorage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          resources:
            requests:
              storage: 10Gi # pd-balanced minimum
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Delete
      whenScaled: Delete
    remoteWriteSettings:
      # Headroom below the 10Gi PVC (operator default = full PVC size). ~60KB/s per vmagent
      # today → ~1.5 days of VMSingle outage buffered.
      maxDiskUsagePerURL: 8GiB
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vmagent
            app.kubernetes.io/instance: vmks
    resources:
      requests: { cpu: 50m, memory: 192Mi }
      limits: { memory: 512Mi }

vmalert:
  enabled: true
  spec:
    image:
      tag: v1.154.1
    replicaCount: 2
    evaluationInterval: 30s
    externalLabels:
      cluster: staging-gke
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vmalert
            app.kubernetes.io/instance: vmks
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

alertmanager:
  enabled: true
  spec:
    # 2 replicas form a gossip cluster (notifications deduplicated across replicas).
    replicaCount: 2
    # Silences and the notification log on a PVC instead of emptyDir: they survive both replicas
    # restarting at once (e.g. a node pool upgrade or Spot preemption).
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: standard-rwo
          resources:
            requests:
              storage: 10Gi # pd-balanced minimum
    persistentVolumeClaimRetentionPolicy:
      whenDeleted: Delete
      whenScaled: Delete
    podDisruptionBudget:
      maxUnavailable: 1
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: kubernetes.io/hostname
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/name: vmalertmanager
            app.kubernetes.io/instance: vmks
    resources:
      requests: { cpu: 10m, memory: 32Mi }
      limits: { memory: 128Mi }
  # Default "blackhole" receiver: alerts are visible in Grafana/vmalert but not sent anywhere.
  # For production add a Slack/Telegram/PagerDuty receiver — keep webhooks/tokens in a Secret
  # (ExternalSecret), NOT in this file.
  config:
    route:
      receiver: blackhole
      group_by: [alertname, namespace, cluster]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: ['alertname=~"InfoInhibitor|Watchdog"']
          receiver: blackhole
    inhibit_rules:
      - target_matchers: ['severity=~"warning|info"']
        source_matchers: ['severity="critical"']
        equal: [cluster, namespace, alertname]
      - target_matchers: ['severity="info"']
        source_matchers: ['alertname="InfoInhibitor"']
        equal: [cluster, namespace]
    receivers:
      - name: blackhole

# =============================================================================
# LOGS — VLSingle + VLAgent DaemonSet (k8sCollector); 90-day retention.
# One VictoriaLogs process ingests and queries. Logs compress ~10-50x, so even 2 TB of raw logs a month
# stays within one node. No HA: during a restart ingestion pauses (vlagent buffers on its node and
# resends) and queries fail.
# =============================================================================
vlsingle:
  enabled: true
  spec:
    retentionPeriod: 90d
    # Per-day partitions: the disk holds the retention. Small disk to start with: once the data reaches
    # this size the oldest days are dropped, so the effective retention is shorter than 90d until the disk
    # grows (raise both numbers; standard-rwo allows volume expansion).
    retentionMaxDiskSpaceUsageBytes: 16GiB
    storage:
      storageClassName: standard-rwo
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
    removePvcAfterDelete: true
    resources:
      requests: { cpu: 100m, memory: 384Mi }
      limits: { memory: 1536Mi }

vlcluster:
  enabled: false

vlagent:
  enabled: true
  spec:
    k8sCollector:
      enabled: true
      # JSON fields from application logs (slog) used as _msg/_time.
      msgFields: [msg, message, log]
      timeFields: [time, timestamp, ts]
      includePodLabels: true
    # Run on ALL nodes (including tainted ones) so no logs are missed.
    tolerations:
      - operator: Exists
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { memory: 256Mi }

# =============================================================================
# TRACES — VTSingle; 30-day retention. Applications send OTLP/HTTP to
#   http://vtsingle-vmks.monitoring.svc:10428/insert/opentelemetry/v1/traces
# Grafana reads via the Jaeger API (/select/jaeger) and runs LogsQL on spans (VictoriaTraces (LogsQL)).
# No HA: during a restart the OpenTelemetry SDKs retry, then drop spans once their queue is full.
# =============================================================================
vtsingle:
  enabled: true
  spec:
    retentionPeriod: 30d
    # Per-day partitions; the oldest days are dropped beyond this size (see the logs note).
    retentionMaxDiskSpaceUsageBytes: 16GiB
    storage:
      storageClassName: standard-rwo
      accessModes: [ReadWriteOnce]
      resources:
        requests:
          storage: 20Gi
    removePvcAfterDelete: true
    # Service graph (experimental): a background task derives the calls between services from
    # parent/child spans every minute, served by /select/jaeger/api/dependencies (the victoriatraces MCP
    # dependencies tool, the Jaeger service graph in Explore). The Shop — Traces dashboard draws its own
    # map from the spans, coloured by failures.
    extraArgs:
      servicegraph.enableTask: "true"
    resources:
      requests: { cpu: 100m, memory: 256Mi }
      limits: { memory: 1536Mi }

vtcluster:
  enabled: false

# =============================================================================
# GRAFANA — datasources: VictoriaMetrics (prometheus + plugin), VictoriaLogs (plugin),
# VictoriaTraces (built-in Jaeger), Alertmanager. Two-way log <-> trace correlation via trace_id.
# =============================================================================
defaultDatasources:
  # VictoriaTraces stores spans the way VictoriaLogs stores logs, so the VictoriaLogs plugin runs LogsQL on
  # them: span analytics (latency, failures and time share per endpoint, operation, SQL statement or
  # attribute) for the Shop — Traces dashboard, computed from the spans at query time. The chart points every
  # victoriatraces datasource at /select/jaeger, so this one is listed here with the plain VTSingle URL.
  extra:
    - name: VictoriaTraces (LogsQL)
      type: victoriametrics-logs-datasource
      access: proxy
      uid: VictoriaTracesLogsQL
      url: http://vtsingle-vmks.monitoring.svc.cluster.local.:10428
      plugin: true
      jsonData:
        maxLines: 1000
        # Span → trace: the trace_id field opens the whole trace in the VictoriaTraces (Jaeger) datasource.
        derivedFields:
          - name: trace_id
            matcherType: label
            matcherRegex: trace_id
            url: '${__value.raw}'
            urlDisplayLabel: View trace
            datasourceUid: VictoriaTraces
  victoriametrics:
    datasources:
      - name: VictoriaMetrics
        type: prometheus
        access: proxy
        uid: VictoriaMetrics
        isDefault: true
        jsonData:
          timeInterval: 30s
      - name: VictoriaMetrics (DS)
        type: victoriametrics-metrics-datasource
        access: proxy
        uid: VictoriaMetricsDS
        isDefault: false
        plugin: true
  victorialogs:
    datasources:
      - name: VictoriaLogs
        type: victoriametrics-logs-datasource
        access: proxy
        uid: VictoriaLogs
        plugin: true
        jsonData:
          maxLines: 1000
          # Log → Trace: the trace_id field (from app slog) links to the VictoriaTraces datasource.
          derivedFields:
            - name: trace_id
              matcherType: label
              matcherRegex: trace_id
              url: '${__value.raw}'
              urlDisplayLabel: View trace
              datasourceUid: VictoriaTraces
  victoriatraces:
    datasources:
      - name: VictoriaTraces
        type: jaeger
        access: proxy
        uid: VictoriaTraces
        jsonData:
          nodeGraph:
            enabled: true
          # Trace → Log: open logs with the same trace_id in VictoriaLogs from a span.
          tracesToLogsV2:
            datasourceUid: VictoriaLogs
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            customQuery: true
            query: 'trace_id:="${__trace.traceId}"'
          # Trace → Metrics: RED metrics of the related service in VictoriaMetrics.
          tracesToMetrics:
            datasourceUid: VictoriaMetrics
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            tags:
              - key: service.name
                value: job
            queries:
              - name: Request rate
                query: 'sum(rate(http_server_requests_total{$__tags}[1m]))'
              - name: Error rate (5xx)
                query: 'sum(rate(http_server_requests_total{$__tags,code=~"5.."}[1m]))'
              - name: p95 latency
                query: 'histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket{$__tags}[1m])) by (le))'

grafana:
  enabled: true
  # Service named "grafana" (not "<release>-grafana") → simpler port-forward.
  fullnameOverride: grafana
  replicas: 1
  # Dashboards & datasources are provisioned from Git; the PVC only keeps runtime state (service
  # accounts and tokens such as mcp-grafana's, annotations, user preferences) across restarts and
  # Spot preemptions. RWO disk → Recreate rollouts; fsGroup 472 makes the root chown init container
  # unnecessary; Helm `lookup` does not run under Argo CD.
  persistence:
    enabled: true
    type: pvc
    storageClassName: standard-rwo
    size: 10Gi # pd-balanced minimum
    lookupVolumeName: false
  deploymentStrategy:
    type: Recreate
  initChownData:
    enabled: false
  # Admin password from the ExternalSecret-generated Secret (observability/manifests): no secret
  # in Git, and stable across Argo CD syncs (the Helm `lookup` issue noted in the chart docs).
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  # Pinned plugin versions (signed, downloaded from grafana.com at startup via Cloud NAT).
  plugins:
    - victoriametrics-metrics-datasource@0.26.1
    - victoriametrics-logs-datasource@0.33.1
  grafana.ini:
    server:
      root_url: http://localhost:3000
    analytics:
      reporting_enabled: false
      check_for_updates: false
      check_for_plugin_updates: false
    users:
      allow_sign_up: false
    auth.anonymous:
      enabled: false
    security:
      disable_gravatar: true
    # JSON logs so VictoriaLogs parses them cleanly.
    log.console:
      format: json
  sidecar:
    dashboards:
      enabled: true
      # App teams can ship dashboards from their own namespace (ConfigMap label grafana_dashboard=1).
      searchNamespace: ALL
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true
    resources:
      requests: { cpu: 10m, memory: 64Mi }
      limits: { memory: 128Mi }
  # The VictoriaLogs datasource plugin runs in this container: with the Shop logs and traces dashboards
  # open (refreshed every minute) Grafana reached its former 768Mi limit, slowed down and failed its probes.
  resources:
    requests: { cpu: 100m, memory: 768Mi }
    limits: { memory: 1536Mi }

# =============================================================================
# Exporters & scrape targets — tuned for GKE (Google-managed control plane).
# =============================================================================
kube-state-metrics:
  enabled: true
  # Node labels on kube_node_labels: zone (CloudNativePG dashboard), and the GKE node pool, provisioning model
  # (spot / standard; preemptible on older pools) and machine type (Cluster — Events dashboard, node alerts).
  metricLabelsAllowlist:
    - nodes=[topology.kubernetes.io/zone,cloud.google.com/gke-nodepool,cloud.google.com/gke-provisioning,cloud.google.com/gke-preemptible,node.kubernetes.io/instance-type]
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }

prometheus-node-exporter:
  enabled: true
  resources:
    requests: { cpu: 10m, memory: 24Mi }
    limits: { memory: 64Mi }

kubelet:
  enabled: true
  vmScrape:
    spec:
      # Chart default labelmaps ALL node labels → on GKE every kubelet/cAdvisor series gets 46–51
      # labels (dozens of cloud.google.com/*), exceeding -maxLabelsPerTimeseries=40, so VictoriaMetrics
      # drops ALL kubelet series. Keep only the node pool name.
      relabelConfigs:
        - sourceLabels: [__meta_kubernetes_node_label_cloud_google_com_gke_nodepool]
          targetLabel: nodepool
        - sourceLabels: [__metrics_path__]
          targetLabel: metrics_path
        - targetLabel: job
          replacement: kubelet
kubeApiServer:
  enabled: true
# GKE: controller-manager, scheduler and etcd are Google-managed and cannot be scraped.
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeEtcd:
  enabled: false
# GKE Dataplane V2 (eBPF/Cilium) does not use kube-proxy.
kubeProxy:
  enabled: false
# GKE uses kube-dns (not CoreDNS) when cluster_dns_provider = KUBE_DNS.
coreDns:
  enabled: false
kubeDns:
  enabled: true
  service:
    enabled: true
