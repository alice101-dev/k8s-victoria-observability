    victoriametrics-vmalert:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.0/dashboards/vmalert.json
    victoriametrics-operator:
      url: https://raw.githubusercontent.com/VictoriaMetrics/VictoriaMetrics/v1.154.0/dashboards/operator.json
      enabled: true
    kubernetes-views-global:
