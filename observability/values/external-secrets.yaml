# =============================================================================
# external-secrets — chart external-secrets/external-secrets 2.13.0
# Generates random secrets declaratively (Password generator): Grafana admin and Redis password.
# No secret values in Git, and values stay stable across Argo CD syncs.
# For multi-cluster production: swap the generator for a GCP Secret Manager ClusterSecretStore
# (Workload Identity) — the application ExternalSecrets keep the same shape.
# =============================================================================
installCRDs: true

replicaCount: 1
concurrent: 1

resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { memory: 192Mi }

# Metrics Services (port 8080) of the three components, scraped by the external-secrets VMServiceScrape in
# observability/platform: ExternalSecret and SecretStore status, sync errors, webhook requests.
metrics:
  service:
    enabled: true

webhook:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { memory: 128Mi }
  metrics:
    service:
      enabled: true

certController:
  replicaCount: 1
  resources:
    requests: { cpu: 10m, memory: 48Mi }
    limits: { memory: 192Mi }
  metrics:
    service:
      enabled: true
