# =============================================================================
# victoria-metrics-operator — chart vm/victoria-metrics-operator 0.68.1 (operator v0.75.0)
# Installed SEPARATELY from k8s-stack (docs recommendation): CRDs and operator have their own
# lifecycle, upgrade/removal order is controlled, and the stack can be removed without the operator.
# =============================================================================
fullnameOverride: vm-operator

# CRDs rendered as templates (not the crds/ folder) → Argo CD upgrades them with the chart.
# Large CRDs → the Application requires ServerSideApply=true.
crds:
  enabled: true
  plain: false

replicaCount: 1

operator:
  # No prometheus-operator CRDs (ServiceMonitor/PodMonitor) in this cluster — converter off.
  disable_prometheus_converter: true

# Admission webhook DISABLED. Its cert comes from Helm `genCA` at render time; Argo CD re-renders
# (no `lookup`), so caBundle and Secret can diverge → ALL CRs rejected with "x509: unknown
# authority", even with the documented ignoreDifferences.
# Validation remains: CRD OpenAPI schema (API server) + operator reconcile status on each CR.
# To use the webhook: install cert-manager and set admissionWebhooks.certManager.enabled=true.
admissionWebhooks:
  enabled: false

# The operator scrapes itself (VMServiceScrape) → "vmoperator" dashboard & alerts.
serviceMonitor:
  enabled: true

resources:
  requests: { cpu: 25m, memory: 80Mi }
  limits: { memory: 256Mi }
